<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="headerContent">
                <a href="index.html" class="brand">BOOK<span
                        style="color: #820000; font-weight: 900;">Market</span></a>
            </div>
        </div>
    </header>

    <section class="RegistrationForm">
        <label>Email</label>
        <input type="email" placeholder="Enter email" id="userEmail">
        <label>Password</label>
        <input type="password" placeholder="Enter Password" id="userPassword">
        <div class="remember">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
        </div>
        <button id="loginBtn">Login</button>
        <p>Don't have an account? <a href="register.html">Register</a></p>
    </section>

    <script src="JS/login.js"></script>
</body>
</html>
