<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="headerContent">
                <a href="index.html" class="brand">BOOK<span
                        style="color: #820000; font-weight: 900;">Market</span></a>
            </div>
        </div>
    </header>
    
    <section class="RegistrationForm">
        <div class="name-fields">
            <div>
                <label>First Name</label>
                <input type="text" placeholder="Enter first name" id="userFirstName">
            </div>
            <div>
                <label>Second Name</label>
                <input type="text" placeholder="Enter second name" id="userSecondName">
            </div>
        </div>
        <label>Email</label>
        <input type="email" placeholder="Enter email" id="userEmail">
        <label>Password</label>
        <input type="password" placeholder="Enter Password" id="userPassword">
        <button id="registerBtn">Register</button>
        <p>Have an account? <a href="login.html"> Login</a></p>
    </section>

    <script src="JS/register.js"></script>
</body>
</html>
